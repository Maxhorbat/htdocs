<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamenIA — Prepárate con Simuladores Inteligentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Navegación Principial -->
  <nav class="p-6 max-w-6xl mx-auto w-full flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl">
        <i class="fas fa-brain"></i>
      </div>
      <span class="text-2xl font-bold tracking-tight">Examen<span class="text-cyan-400">IA</span></span>
    </div>
    <div class="flex gap-3">
      <button onclick="openAuthModal('login')" class="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:border-cyan-400 hover:text-white transition font-medium">
        Iniciar Sesión
      </button>
      <button onclick="openAuthModal('register')" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold transition">
        Registrarse
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="max-w-4xl mx-auto text-center px-4 py-16 space-y-6">
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight">
      Pon a prueba tus conocimientos con <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Exámenes Adaptativos</span>
    </h1>
    <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto">
      Crea tu cuenta para guardar tu progreso, resolver simuladores de 20 a 50 preguntas y visualizar tu historial académico en MySQL local.
    </p>
    <div class="flex justify-center gap-4 pt-4">
      <button onclick="openAuthModal('register')" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-lg shadow-[0_0_25px_rgba(6,182,212,0.4)] hover:scale-105 transition">
        Crear Cuenta Gratis
      </button>
    </div>
  </header>

  <!-- Modal Unificado de Autenticación / Registro -->
  <div id="auth-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 rounded-3xl w-full max-w-md p-6 border border-slate-800 relative space-y-4 shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-2xl text-slate-400 hover:text-white">×</button>
      
      <h2 id="auth-title" class="text-2xl font-bold text-center">Crear Cuenta</h2>
      
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Correo Electrónico</label>
          <input type="email" id="auth-email" required placeholder="usuario@correo.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400 text-slate-100">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Contraseña</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400 text-slate-100">
        </div>
        
        <div id="confirm-password-container" class="hidden">
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Confirmar Contraseña</label>
          <input type="password" id="auth-confirm-password" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400 text-slate-100">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition shadow-[0_0_15px_rgba(6,182,212,0.3)]">
          Registrarme
        </button>
      </form>
      
      <p class="text-center text-sm text-slate-400">
        <span id="auth-switch-text">¿Ya tienes cuenta?</span>
        <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-cyan-400 underline font-semibold ml-1">Inicia Sesión</button>
      </p>
    </div>
  </div>

  <footer class="text-center py-6 border-t border-slate-900 text-slate-500 text-sm">
    © 2026 ExamenIA. Sistema registrado localmente en XAMPP.
  </footer>

  <script src="auth.js"></script>
  <script>
    let isLogin = false;

    function openAuthModal(mode = 'register') {
      isLogin = mode === 'login';
      updateModalUI();
      document.getElementById("auth-modal").classList.remove("hidden");
    }

    function closeAuthModal() { 
      document.getElementById("auth-modal").classList.add("hidden"); 
    }

    function toggleAuthMode() {
      isLogin = !isLogin;
      updateModalUI();
    }

    function updateModalUI() {
      const title = document.getElementById("auth-title");
      const submitBtn = document.getElementById("auth-submit-btn");
      const switchText = document.getElementById("auth-switch-text");
      const switchBtn = document.getElementById("auth-switch-btn");
      const confirmContainer = document.getElementById("confirm-password-container");

      if (isLogin) {
        title.textContent = "Iniciar Sesión";
        submitBtn.textContent = "Ingresar";
        switchText.textContent = "¿No tienes cuenta?";
        switchBtn.textContent = "Regístrate";
        confirmContainer.classList.add("hidden");
      } else {
        title.textContent = "Crear Cuenta";
        submitBtn.textContent = "Registrarme";
        switchText.textContent = "¿Ya tienes cuenta?";
        switchBtn.textContent = "Inicia Sesión";
        confirmContainer.classList.remove("hidden");
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;

      try {
        if (isLogin) {
          await signInUser(email, pass);
        } else {
          const confirmPass = document.getElementById("auth-confirm-password").value;
          if (pass !== confirmPass) {
            alert("Las contraseñas no coinciden.");
            return;
          }
          await signUpUser(email, pass);
          alert("¡Registro exitoso! Redirigiendo a tu panel de control...");
        }
        window.location.href = "app.html";
      } catch (err) {
        alert("Atención: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = "app.html";
    });
  </script>
</body>
</html>
