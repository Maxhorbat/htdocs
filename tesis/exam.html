<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen – ExamenIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-5 md:p-8">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-4">
        <span id="progress" class="text-2xl font-bold text-emerald-400 font-mono">1/10</span>
        <div class="w-40 sm:w-56 h-2.5 bg-gray-800 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-emerald-500 rounded-full progress-bar" style="width:10%"></div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div id="timer-box" class="flex items-center gap-2 px-4 py-2 bg-gray-800 rounded-2xl border border-gray-700">
          <i class="fas fa-clock text-emerald-400"></i>
          <span id="timer" class="font-mono text-xl font-bold text-emerald-400">05:00</span>
        </div>
        <button onclick="finishExam()" class="text-red-400 hover:text-red-500 text-sm flex items-center gap-1">
          <i class="fas fa-times"></i> Finalizar
        </button>
      </div>
    </div>

    <div class="bg-gray-900 rounded-3xl p-8 md:p-10 border border-gray-800 min-h-[380px]">
      <div id="question" class="text-xl md:text-2xl leading-relaxed mb-10 font-medium"></div>
      <div id="options" class="space-y-3"></div>
    </div>

    <div class="flex justify-between mt-8">
      <button id="btn-prev" onclick="prevQ()"
              class="px-6 py-3.5 bg-gray-800 hover:bg-gray-700 rounded-2xl flex items-center gap-2 transition">
        <i class="fas fa-arrow-left"></i> Anterior
      </button>
      <button id="btn-next" onclick="nextQ()"
              class="px-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl flex items-center gap-2 transition">
        Siguiente <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script src="courses.js"></script>
  <script src="ai.js"></script>
  <script src="script.js"></script>
  <script>
    let examData = null;
    let currentIndex = 0;
    let timeLeft = 0;
    let timerInterval = null;

    function startTimer() {
      timeLeft = examData.totalTime || (examData.timePerQuestion || 60) * examData.questions.length;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("⏰ ¡Se acabó el tiempo! El examen se enviará automáticamente.");
          window.location.href = "results.html";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const display = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = display;
      timerEl.classList.remove("timer-warning", "timer-danger", "text-emerald-400");
      if (timeLeft <= 30) timerEl.classList.add("timer-danger");
      else if (timeLeft <= 60) timerEl.classList.add("timer-warning");
      else timerEl.classList.add("text-emerald-400");
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function loadQuestion() {
      if (!examData) return;
      const q = examData.questions[currentIndex];
      document.getElementById("question").innerHTML =
        `<span class="text-emerald-400 text-sm font-mono block mb-2">Pregunta ${currentIndex + 1}</span>${q.q}`;

      const container = document.getElementById("options");
      container.innerHTML = "";

      q.options.forEach((opt, i) => {
        const selected = examData.userAnswers[currentIndex] === i;
        const div = document.createElement("div");
        div.className = `option p-5 rounded-2xl cursor-pointer text-base border transition
          ${selected ? "border-emerald-500 bg-emerald-900/30" : "border-gray-700 hover:border-gray-500 bg-gray-800/50"}`;
        div.textContent = opt;
        div.onclick = () => {
          examData.userAnswers[currentIndex] = i;
          localStorage.setItem("currentExam", JSON.stringify(examData));
          loadQuestion();
        };
        container.appendChild(div);
      });

      document.getElementById("progress").textContent = `${currentIndex + 1}/${examData.questions.length}`;
      document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / examData.questions.length) * 100}%`;
      document.getElementById("btn-prev").style.visibility = currentIndex === 0 ? "hidden" : "visible";
      const nextBtn = document.getElementById("btn-next");
      nextBtn.innerHTML = currentIndex === examData.questions.length - 1
        ? `Ver resultados <i class="fas fa-check"></i>`
        : `Siguiente <i class="fas fa-arrow-right"></i>`;
    }

    function nextQ() {
      if (currentIndex < examData.questions.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        stopTimer();
        window.location.href = "results.html";
      }
    }

    function prevQ() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
      }
    }

    function finishExam() {
      if (confirm("¿Terminar el examen ahora?")) {
        stopTimer();
        window.location.href = "results.html";
      }
    }

    try {
      examData = JSON.parse(localStorage.getItem("currentExam"));
      if (!examData || !examData.questions?.length) {
        alert("No hay examen activo. Volviendo al inicio.");
        window.location.href = "index.html";
      } else {
        window.addEventListener("beforeunload", stopTimer);
        loadQuestion();
        startTimer();
      }
    } catch (e) {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
