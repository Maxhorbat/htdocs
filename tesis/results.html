<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados – ExamenIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#050510] text-slate-100 min-h-screen neon-grid">
  <div class="max-w-3xl mx-auto p-5 md:p-10 relative z-10">
    <div class="neon-card p-8 md:p-12">
      <div class="text-center mb-10">
        <h1 class="text-3xl font-bold font-display mb-2">
          <span class="neon-text">Resultados</span>
        </h1>
        <p id="exam-meta" class="text-sm text-slate-400 mb-8"></p>

        <div id="score-circle"
             class="mx-auto w-44 h-44 rounded-full border-8 border-cyan-400 neon-score-ring flex flex-col items-center justify-center mb-6">
          <div id="final-score" class="text-6xl font-bold font-display neon-text">0</div>
          <div class="text-cyan-300/80 text-xs tracking-widest">PUNTOS</div>
        </div>
        <div class="flex justify-center gap-10 text-sm">
          <div>
            <div id="correct-count" class="text-2xl font-bold text-emerald-400">0</div>
            <div class="text-slate-500">Correctas</div>
          </div>
          <div>
            <div id="incorrect-count" class="text-2xl font-bold text-pink-400">0</div>
            <div class="text-slate-500">Incorrectas</div>
          </div>
          <div>
            <div id="time-used" class="text-2xl font-bold text-violet-300">--:--</div>
            <div class="text-slate-500">Tiempo</div>
          </div>
        </div>
      </div>

      <div id="review" class="space-y-5 max-h-[420px] overflow-y-auto pr-2"></div>

      <div class="flex flex-col sm:flex-row gap-4 mt-10">
        <button onclick="window.location.href='index.html'"
                class="flex-1 py-5 neon-icon-btn rounded-2xl font-medium">
          Volver al inicio
        </button>
        <button onclick="restartSame()"
                class="flex-1 py-5 neon-btn rounded-2xl font-medium">
          Repetir examen
        </button>
      </div>
    </div>
  </div>

  <script src="courses.js"></script>
  <script src="ai.js"></script>
  <script src="script.js"></script>
  <script>
    const exam = JSON.parse(localStorage.getItem("currentExam") || "null");
    if (!exam) window.location.href = "index.html";

    const levelLabels = {
      escuela: "Escuela",
      secundaria: "Secundaria",
      tecnica: "Carrera técnica",
      universidad: "Universidad"
    };
    const diffLabels = { 1: "Fácil", 2: "Medio", 3: "Difícil" };

    document.getElementById("exam-meta").textContent =
      `${exam.topic} · ${levelLabels[exam.studyLevel] || ""} · ${diffLabels[exam.difficulty] || "Medio"}`;

    let correctCount = 0;
    const reviewHTML = exam.questions.map((q, i) => {
      const user = exam.userAnswers[i];
      const isRight = user === q.correct;
      if (isRight) correctCount++;
      return `
        <div class="rounded-2xl p-5 border ${isRight ? "border-emerald-500/40 bg-emerald-500/10" : "border-pink-500/40 bg-pink-500/10"}">
          <div class="flex justify-between gap-3 mb-2">
            <p class="font-medium">${q.q}</p>
            <span class="${isRight ? "text-emerald-400" : "text-pink-400"} whitespace-nowrap text-sm">
              ${isRight ? "✓ Correcto" : "✗ Incorrecto"}
            </span>
          </div>
          <p class="text-sm text-slate-400">
            Tu respuesta: <span class="${isRight ? "text-emerald-400" : "text-pink-400"}">
              ${user !== undefined ? q.options[user] : "Sin responder"}
            </span>
          </p>
          ${!isRight ? `<p class="text-sm text-cyan-300 mt-1">Correcta: ${q.options[q.correct]}</p>` : ""}
          ${q.exp ? `<div class="mt-3 text-xs bg-black/40 border border-white/5 p-3 rounded-xl text-slate-400">${q.exp}</div>` : ""}
        </div>`;
    }).join("");

    const percentage = Math.round((correctCount / exam.questions.length) * 100);
    document.getElementById("final-score").textContent = percentage;
    document.getElementById("correct-count").textContent = correctCount;
    document.getElementById("incorrect-count").textContent = exam.questions.length - correctCount;
    document.getElementById("review").innerHTML = reviewHTML;

    const elapsed = Math.floor((Date.now() - exam.startTime) / 1000);
    const em = Math.floor(elapsed / 60);
    const es = elapsed % 60;
    document.getElementById("time-used").textContent =
      `${String(em).padStart(2, "0")}:${String(es).padStart(2, "0")}`;

    const circle = document.getElementById("score-circle");
    if (percentage < 50) {
      circle.classList.remove("border-cyan-400");
      circle.classList.add("border-pink-500");
    } else if (percentage < 70) {
      circle.classList.remove("border-cyan-400");
      circle.classList.add("border-yellow-400");
    }

    let history = JSON.parse(localStorage.getItem("examHistory") || "[]");
    history.unshift({
      topic: exam.topic,
      score: percentage,
      date: exam.date || new Date().toLocaleDateString("es-ES"),
      difficulty: exam.difficulty,
      studyLevel: exam.studyLevel
    });
    localStorage.setItem("examHistory", JSON.stringify(history.slice(0, 30)));
  </script>
</body>
</html>
