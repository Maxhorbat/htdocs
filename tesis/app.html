<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamenIA — Configurar Examen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg">
    <header class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl shadow-[0_0_15px_rgba(6,182,212,0.3)]">
          <i class="fas fa-brain"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Examen<span class="text-cyan-400">IA</span></h1>
      </div>
      <div class="flex gap-2">
        <button onclick="showHistory()" title="Historial" class="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 transition flex items-center justify-center">
          <i class="fas fa-history"></i>
        </button>
        <button onclick="signOutUser()" title="Cerrar Sesión" class="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 text-red-400 hover:border-red-500/50 transition flex items-center justify-center">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <main class="glass-card rounded-3xl p-6 border border-slate-800/80 space-y-6 shadow-2xl">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nivel de Estudio</label>
        <div class="grid grid-cols-2 gap-2">
          <button data-study="escuela" onclick="setStudyLevel('escuela')" class="py-3 px-3 rounded-xl bg-slate-900 border border-slate-800 text-sm font-medium text-slate-200 transition text-left hover:border-cyan-400">🌱 Escuela</button>
          <button data-study="secundaria" onclick="setStudyLevel('secundaria')" class="py-3 px-3 rounded-xl bg-slate-900 border border-slate-800 text-sm font-medium text-slate-200 transition text-left hover:border-cyan-400">📐 Secundaria</button>
          <button data-study="tecnica" onclick="setStudyLevel('tecnica')" class="py-3 px-3 rounded-xl bg-slate-900 border border-slate-800 text-sm font-medium text-slate-200 transition text-left hover:border-cyan-400">🌐 Técnica</button>
          <button data-study="universidad" onclick="setStudyLevel('universidad')" class="py-3 px-3 rounded-xl bg-slate-900 border border-slate-800 text-sm font-medium text-slate-200 transition text-left hover:border-cyan-400">💻 Universidad</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Curso</label>
        <select id="topic-input" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-200 outline-none focus:border-cyan-400 transition"></select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Dificultad</label>
        <div class="grid grid-cols-3 gap-2">
          <button id="d1" onclick="setDiff(1)" class="diff-btn py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 font-medium transition">Fácil</button>
          <button id="d2" onclick="setDiff(2)" class="diff-btn py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 font-medium transition">Medio</button>
          <button id="d3" onclick="setDiff(3)" class="diff-btn py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 font-medium transition">Difícil</button>
        </div>
      </div>

      <!-- Contador de Preguntas (Min 20, Max 50, Def 20) -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Número de Preguntas</label>
          <span id="q-count" class="text-cyan-400 font-bold bg-cyan-950/60 border border-cyan-500/30 px-2.5 py-0.5 rounded-full text-xs">20</span>
        </div>
        <input type="range" id="num-q" min="20" max="50" value="20" class="w-full accent-cyan-400 bg-slate-800 h-2 rounded-lg cursor-pointer">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Segundos por pregunta</label>
        <input type="number" id="time-per-q" value="60" min="10" max="300" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-slate-200 outline-none focus:border-cyan-400 transition">
      </div>

      <button onclick="startNewExam()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold tracking-wide shadow-[0_0_20px_rgba(6,182,212,0.4)] transition active:scale-[0.98] flex items-center justify-center gap-2">
        <i class="fas fa-play"></i> COMENZAR EXAMEN
      </button>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="courses.js"></script>
  <script src="script.js"></script>
</body>
</html>
