<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36CFC9',
            dark: '#1D2129',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <a href="index.html" class="text-primary font-bold text-2xl inline-block mb-2">MiProyecto</a>
      <h2 class="text-2xl font-bold">Crea tu cuenta</h2>
      <p class="text-gray-600 mt-1">Completa los datos para registrarte</p>
    </div>

    <form class="space-y-5">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
          <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition" placeholder="Tu nombre">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
          <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition" placeholder="Tus apellidos">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition" placeholder="correo@ejemplo.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition" placeholder="Mínimo 8 caracteres">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input type="tel" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition" placeholder="+51 999 999 999">
      </div>

      <div class="flex items-start gap-2">
        <input type="checkbox" class="mt-1 text-primary">
        <p class="text-sm text-gray-600">Acepto los <a href="#" class="text-primary hover:underline">términos y condiciones</a> y la <a href="#" class="text-primary hover:underline">política de privacidad</a>.</p>
      </div>

      <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-primary/90 shadow-md hover:shadow-lg transition-all">
        Registrarme
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      ¿Ya tienes cuenta? <a href="#" class="text-primary hover:underline">Inicia sesión</a>
    </p>

    <div class="text-center mt-4">
      <a href="index.html" class="text-sm text-gray-500 hover:text-primary flex items-center justify-center gap-1">
        <i class="fa fa-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>
</body>
</html>
