<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón Lila & Flor de Rapunzel - A y F</title>
  <!-- Fuentes elegantes para el horario y las iniciales -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      position: relative;
    }

    /* Horario / Contador arriba del corazón */
    .timer-container {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 30;
      width: 90%;
      max-width: 600px;
    }
    .timer-title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #f3e8ff;
      text-shadow: 0 0 10px #c084fc, 0 0 20px #a855f7;
      margin-bottom: 6px;
    }
    .timer-clock {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #e9d5ff;
      text-shadow: 0 0 8px #d8b4fe, 0 0 15px #9333ea;
      background: rgba(123, 31, 162, 0.2);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(224, 170, 255, 0.35);
      backdrop-filter: blur(5px);
      display: inline-block;
    }

    /* Contenedor principal del corazón */
    .heart-container {
      position: relative;
      width: 340px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      margin-top: 50px;
    }

    /* Corazón neón lila (SVG) */
    .neon-heart {
      width: 300px;
      height: 280px;
      filter: drop-shadow(0 0 8px #c77dff)
              drop-shadow(0 0 20px #b24bf3)
              drop-shadow(0 0 40px #9b30ef)
              drop-shadow(0 0 60px #7b1fa2);
      animation: heartbeat 1.8s ease-in-out infinite;
    }
    .neon-heart path {
      fill: rgba(199, 125, 255, 0.12);
      stroke: #e0aaff;
      stroke-width: 4;
      stroke-linejoin: round;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.06); }
      30% { transform: scale(1); }
      45% { transform: scale(1.04); }
      60% { transform: scale(1); }
    }

    /* Flor de Rapunzel (Sundrop) en el centro */
    .flower {
      position: absolute;
      width: 110px;
      height: 110px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -42%);
      z-index: 20;
    }
    .petal {
      position: absolute;
      width: 36px;
      height: 55px;
      background: linear-gradient(180deg, #fff8e1 0%, #ffd54f 40%, #ffb300 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      top: 50%;
      left: 50%;
      transform-origin: center bottom;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.7),
                  inset 0 -8px 12px rgba(255, 160, 0, 0.3);
    }
    .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); }
    .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); }
    .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); }
    .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); }
    .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); }
    .petal:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); }
    .petal:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); }
    .flower-center {
      position: absolute;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #fffde7 0%, #ffeb3b 40%, #ffc107 100%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px #ffeb3b,
                  0 0 40px rgba(255, 235, 59, 0.6),
                  inset 0 0 8px #fff;
      z-index: 5;
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px #ffeb3b, 0 0 40px rgba(255, 235, 59, 0.6), inset 0 0 8px #fff; }
      50% { box-shadow: 0 0 30px #fff59d, 0 0 60px rgba(255, 235, 59, 0.9), inset 0 0 12px #fff; }
    }

    /* Iniciales A & F dentro del corazón */
    .initials {
      position: absolute;
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 8px #e0aaff, 0 0 15px #b24bf3, 0 0 25px #9b30ef;
      z-index: 25;
      pointer-events: none;
    }
    .initial-a {
      top: 52%;
      left: 18%;
      transform: translateY(-50%);
    }
    .initial-f {
      top: 52%;
      right: 18%;
      transform: translateY(-50%);
    }

    /* Elementos flotantes (corazones y textos) */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .mini-heart {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0.85;
      animation: floatUp linear forwards;
    }
    .mini-heart svg {
      width: 100%;
      height: 100%;
      fill: #d8b4fe;
      filter: drop-shadow(0 0 4px #c084fc)
              drop-shadow(0 0 8px #a855f7);
    }

    /* Texto I LOVE YOU flotante */
    .floating-text {
      position: absolute;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #f0abfc;
      text-shadow: 0 0 6px #c084fc, 0 0 12px #a855f7;
      white-space: nowrap;
      opacity: 0.85;
      animation: floatUp linear forwards;
    }

    /* Animación de flotar y reventar */
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
        transform: translateY(-10vh) scale(1) rotate(10deg);
      }
      70% {
        opacity: 0.85;
        transform: translateY(-70vh) scale(1.1) rotate(-15deg);
      }
      85% {
        opacity: 0.6;
        transform: translateY(-85vh) scale(1.2) rotate(20deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh) scale(0) rotate(0deg);
      }
    }

    .mini-heart.pop, .floating-text.pop {
      animation: popBurst 0.45s ease-out forwards;
    }
    @keyframes popBurst {
      0% { transform: scale(1); opacity: 0.9; filter: brightness(1); }
      40% { transform: scale(1.8); opacity: 1; filter: brightness(1.8); }
      100% { transform: scale(0); opacity: 0; filter: brightness(2); }
    }

    /* Partículas del pop */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e9d5ff;
      box-shadow: 0 0 6px #c084fc;
      pointer-events: none;
      animation: particleFly 0.6s ease-out forwards;
    }
    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Texto inferior */
    .title {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      color: #e9d5ff;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      text-shadow: 0 0 10px #c084fc;
      z-index: 5;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Contador/Horario arriba del corazón -->
  <div class="timer-container">
    <div class="timer-title">Juntos desde el 3 de Julio de 2026</div>
    <div class="timer-clock" id="timerClock">Cargando tiempo...</div>
  </div>

  <div class="floating-hearts" id="heartsContainer"></div>

  <div class="heart-container">
    <!-- Iniciales A y F dentro del corazón -->
    <div class="initials initial-a">A</div>
    <div class="initials initial-f">F</div>

    <!-- Corazón neón lila -->
    <svg class="neon-heart" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 80 
               C20 55, 5 35, 5 22 
               C5 10, 15 2, 27 2 
               C38 2, 46 10, 50 18 
               C54 10, 62 2, 73 2 
               C85 2, 95 10, 95 22 
               C95 35, 80 55, 50 80 Z"/>
    </svg>

    <!-- Flor de Rapunzel (Sundrop Flower) -->
    <div class="flower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="flower-center"></div>
    </div>
  </div>

  <div class="title">♡ flor de rapunzel ♡</div>

  <script>
    // LÓGICA DEL CONTADOR (Desde 3 de Julio de 2026)
    const startDate = new Date('2026-07-03T00:00:00');

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      if (diff < 0) {
        document.getElementById('timerClock').innerText = "Inicia el 3 de Julio de 2026";
        return;
      }

      const seconds = Math.floor((diff / 1000) % 60);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      document.getElementById('timerClock').innerText = 
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // GENERACIÓN DE ELEMENTOS FLOTANTES
    const container = document.getElementById('heartsContainer');
    const colors = ['#d8b4fe', '#e9d5ff', '#c084fc', '#f0abfc', '#dda0dd'];

    function createFloatingItem() {
      const isText = Math.random() < 0.35;
      const item = document.createElement('div');
      const color = colors[Math.floor(Math.random() * colors.length)];

      if (isText) {
        item.className = 'floating-text';
        item.innerText = 'I LOVE YOU';
        item.style.color = color;
      } else {
        item.className = 'mini-heart';
        const size = 12 + Math.random() * 16;
        item.style.width = size + 'px';
        item.style.height = size + 'px';
        item.innerHTML = `
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="${color}" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
      }

      item.style.left = Math.random() * 90 + 5 + 'vw';
      item.style.bottom = '-30px';
      const duration = 6 + Math.random() * 8;
      item.style.animationDuration = duration + 's';

      container.appendChild(item);

      const popTime = 2000 + Math.random() * (duration * 1000 - 3000);
      setTimeout(() => {
        if (item.parentNode) {
          const rect = item.getBoundingClientRect();
          createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, color);
          item.classList.add('pop');
          setTimeout(() => item.remove(), 450);
        }
      }, popTime);

      setTimeout(() => {
        if (item.parentNode) item.remove();
      }, (duration + 2) * 1000);
    }

    function createParticles(x, y, color) {
      const particleCount = 6 + Math.floor(Math.random() * 5);
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = color;
        p.style.boxShadow = `0 0 6px ${color}`;
        const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
        const distance = 30 + Math.random() * 50;
        p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function spawnItems() {
      createFloatingItem();
      setTimeout(spawnItems, 350 + Math.random() * 500);
    }

    for (let i = 0; i < 10; i++) {
      setTimeout(createFloatingItem, i * 250);
    }
    spawnItems();
  </script>
</body>
</html>
